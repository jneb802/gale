name: Build test installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build unsigned test MSI
        run: pnpm tauri build --bundles msi --config src-tauri/tauri.test.conf.json
        env:
          GALE_APP_GUID: com.praetoris.galetest

      - name: Verify test application starts
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/gale.exe"
          $process = Start-Process $exe -PassThru

          try {
            Start-Sleep -Seconds 15
            $process.Refresh()

            if ($process.HasExited) {
              throw "Gale exited during startup with code $($process.ExitCode)."
            }

            if (-not $process.Responding) {
              throw "Gale did not respond after startup."
            }

            $log = Join-Path $env:APPDATA "com.praetoris.galetest/latest.log"
            if (-not (Test-Path $log)) {
              throw "Gale did not create its isolated test log at $log."
            }

            Get-Content $log
            if (-not (Select-String -Path $log -SimpleMatch "setup done" -Quiet)) {
              throw "Gale did not finish backend setup."
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload test MSI
        uses: actions/upload-artifact@v4
        with:
          name: gale-praetoris-test-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
